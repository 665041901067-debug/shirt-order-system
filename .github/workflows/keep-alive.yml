name: Supabase Database Keep-Alive

on:
  schedule:
    # Run once every day at 06:00 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive API Endpoint
        run: |
          curl -s -X GET "https://shirt-order-system.vercel.app/api/keep-alive" | grep "success" || echo "Ping executed"
